<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">Flori Input — Open-source input automation for Windows</title>
  <desc id="description">English adaptation of the project's dark social preview, using the FloriInputUI font.</desc>
  <style>
    @font-face { font-family: "FloriInputUI"; src: url("../../../resources/fonts/FloriInputUI-Medium.ttf") format("truetype"); font-style: normal; font-weight: 500; }
    text { font-family: "FloriInputUI"; font-weight: 500; }
  </style>
  <rect width="1280" height="720" fill="#21252b"/>
  <g transform="translate(80 118)">
    <text x="0" y="128" fill="#ffffff" font-size="78">Flori Input</text>
    <text x="2" y="205" fill="#f1f3f6" font-size="28">Open-source input automation for Windows</text>
    <text x="2" y="257" fill="#aeb6c3" font-size="22">Built with Slint UI. Runtime memory: ~20 MiB</text>
    <g transform="translate(0 319)" font-size="19">
      <g><rect width="174" height="46" rx="23" fill="#282c34" stroke="#3e4451"/><circle cx="23" cy="23" r="7" fill="#61afef"/><text x="43" y="30" fill="#ffffff">Rapid input</text></g>
