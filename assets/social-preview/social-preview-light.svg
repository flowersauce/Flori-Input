    <g stroke="#f2b8b8" stroke-width="5.856" fill="none" opacity="0.96"><circle cx="512" cy="346.08" r="131.76"/><circle cx="669.799" cy="460.728" r="131.76"/><circle cx="609.525" cy="646.232" r="131.76"/><circle cx="414.475" cy="646.232" r="131.76"/><circle cx="354.201" cy="460.728" r="131.76"/></g>
    <g fill="#dca5a5"><circle cx="512" cy="346.08" r="117.12"/><circle cx="669.799" cy="460.728" r="117.12"/><circle cx="609.525" cy="646.232" r="117.12"/><circle cx="414.475" cy="646.232" r="117.12"/><circle cx="354.201" cy="460.728" r="117.12"/><circle cx="512" cy="512" r="117.12"/></g>
    <g fill="#f6ddd6" opacity="0.55"><circle cx="512" cy="458.32" r="56.12"/><circle cx="563.053" cy="495.412" r="56.12"/><circle cx="543.552" cy="555.428" r="56.12"/><circle cx="480.448" cy="555.428" r="56.12"/><circle cx="460.947" cy="495.412" r="56.12"/></g>
