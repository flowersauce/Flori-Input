<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Flori Input 浅色主题 — 面向 Windows 的开源键鼠自动化工具</title>
  <desc id="description">使用仓库 FloriInputUI 字体的浅色主题社交预览。</desc>
  <style>
    @font-face { font-family: "FloriInputUI"; src: url("../resources/fonts/FloriInputUI-Medium.ttf") format("truetype"); font-style: normal; font-weight: 500; }
    text { font-family: "FloriInputUI"; font-weight: 500; }
  </style>
  <rect width="1280" height="640" fill="#edf1f7"/>
  <g transform="translate(80 78)">
    <text x="0" y="128" fill="#0f1720" font-size="78">Flori Input</text>
    <text x="2" y="205" fill="#17212c" font-size="32">面向 Windows 的开源键鼠自动化工具</text>
    <text x="2" y="257" fill="#596675" font-size="22">基于 Slint UI 构建，运行时内存占用仅约 20 MiB</text>
    <g transform="translate(0 319)" font-size="19">
      <g><rect width="174" height="46" rx="23" fill="#ffffff" stroke="#a8b2c1"/><circle cx="23" cy="23" r="7" fill="#2f6fed"/><text x="43" y="30" fill="#0f1720">高速按键输入</text></g>
      <g transform="translate(188 0)"><rect width="174" height="46" rx="23" fill="#ffffff" stroke="#a8b2c1"/><circle cx="23" cy="23" r="7" fill="#dca5a5"/><text x="43" y="30" fill="#0f1720">文本模拟输入</text></g>
      <g transform="translate(376 0)"><rect width="196" height="46" rx="23" fill="#ffffff" stroke="#a8b2c1"/><circle cx="23" cy="23" r="7" fill="#50a14f"/><text x="43" y="30" fill="#0f1720">自动化事件编排</text></g>
    </g>
    <g transform="translate(0 442)"><circle cx="8" cy="23" r="6" fill="#a626a4"/><text x="28" y="30" fill="#596675" font-size="19">github.com/flowersauce/Flori-Input</text></g>
  </g>
  <g transform="translate(742 78) scale(0.46875)" aria-label="Flori Input 透明底 Logo">
