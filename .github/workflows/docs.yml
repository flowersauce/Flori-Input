name: Deploy documentation

on:
  push:
    branches:
      - slint

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Deploy MkDocs
        run: uv run mkdocs gh-deploy --force